<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>合成小马 · 英语单词合成</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-y: auto; }
  body {
    min-height: 100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #3F2A1E;
    background:
      radial-gradient(900px 520px at 8% -8%, #FFE2B0 0%, rgba(255,226,176,0) 62%),
      radial-gradient(820px 520px at 98% 2%, #FFD6E5 0%, rgba(255,214,229,0) 58%),
      radial-gradient(900px 620px at 50% 108%, #D6F5E6 0%, rgba(214,245,230,0) 62%),
      #FFF8EC;
    background-attachment: fixed;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(63, 42, 30, .035) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .app {
    position: relative; z-index: 1;
    max-width: 1000px; margin: 0 auto;
    padding: 26px 20px 32px;
  }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .orb {
    width: 54px; height: 54px; border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 32% 26%, #FFF6C4 0%, #FFD43B 42%, #F59F00 100%);
    box-shadow: inset -7px -9px 16px rgba(180, 95, 0, .28), inset 6px 7px 12px rgba(255, 255, 255, .55), 0 10px 22px rgba(245, 159, 0, .28);
  }
  .orb::before {
    content: ""; position: absolute; left: 25%; top: 19%; width: 26%; height: 17%;
    border-radius: 50%; background: rgba(255, 255, 255, .85); transform: rotate(-28deg);
  }
  .orb::after {
    content: ""; position: absolute; left: 31%; top: 50%; width: 38%; height: 20%;
    border-bottom: 2.5px solid rgba(63, 42, 30, .7); border-radius: 0 0 50% 50%;
  }
  h1 { margin: 0; font-size: clamp(23px, 3.2vw, 32px); line-height: 1.05; letter-spacing: 1px; font-weight: 900; }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #FF6B6B 5%, #FFA94D 45%, #F06595 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 5px 0 0; font-size: 10.5px; letter-spacing: 3.5px; color: #A98C72; font-weight: 700; }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 800;
    font-size: 13.5px; padding: 11px 18px; border-radius: 999px;
    background: #fff; color: #3F2A1E; letter-spacing: .5px;
    box-shadow: 0 4px 0 rgba(150, 110, 70, .10), 0 10px 22px rgba(150, 100, 60, .10);
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(150, 110, 70, .10), 0 14px 26px rgba(150, 100, 60, .14); }
  .btn:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(150, 110, 70, .10); }
  .btn.ghost { background: rgba(255, 255, 255, .7); border: 1px solid rgba(63, 42, 30, .09); }
  .btn.ghost.muted { color: #B0967F; }
  .btn.primary {
    background: linear-gradient(135deg, #FF9A6B, #FF5C7A);
    color: #fff; font-size: 16px; letter-spacing: 3px; padding: 15px 38px;
    box-shadow: 0 7px 0 #DD3E5C, 0 18px 32px rgba(255, 92, 122, .32);
  }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #DD3E5C, 0 22px 36px rgba(255, 92, 122, .36); }
  .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #DD3E5C; }

  /* 布局 */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 500px) 290px;
    gap: 26px; justify-content: center; align-items: start;
  }
  .stage {
    position: relative; width: 100%; max-width: 500px; justify-self: center;
    background: #FFF6E8; border-radius: 32px; overflow: hidden;
    box-shadow: 0 28px 60px rgba(150, 100, 60, .16), inset 0 2px 0 rgba(255, 255, 255, .9);
  }
  .hud {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 20px 11px;
    background: linear-gradient(180deg, #FFFDF9 0%, #FFF7EC 100%);
    border-bottom: 1px solid rgba(226, 190, 150, .35);
  }
  .hud .label { display: block; font-size: 9.5px; letter-spacing: 3px; color: #B0967F; font-weight: 800; margin-bottom: 1px; }
  .score {
    display: block; font-size: 33px; line-height: 1; font-weight: 900;
    letter-spacing: 1px; font-variant-numeric: tabular-nums;
    transition: transform .16s cubic-bezier(.2, 1.8, .4, 1);
  }
  .score.pop { transform: scale(1.14); }
  .best { font-size: 10px; color: #B0967F; font-weight: 700; }
  .best b { color: #F76707; margin-left: 2px; font-variant-numeric: tabular-nums; }
  .next-box { display: flex; align-items: center; gap: 8px; text-align: right; }
  .next-name {
    display: block; font-size: 12px; font-weight: 900; letter-spacing: .5px;
    max-width: 92px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #nextCanvas { width: 60px; height: 60px; display: block; filter: drop-shadow(0 5px 8px rgba(120, 80, 40, .12)); }
  .word-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 18px;
    background: linear-gradient(90deg, #FFF7E0, #FFF0F5);
    border-bottom: 1px solid rgba(226, 190, 150, .35);
    min-height: 52px;
  }
  .word-grade {
    flex: none; font-size: 9px; font-weight: 900; color: #A86200;
    background: #FFE7B8; border-radius: 999px; padding: 4px 8px;
    white-space: nowrap; letter-spacing: .5px;
  }
  .word-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
  .word-main strong {
    font-size: 17px; letter-spacing: .4px; color: #3F2A1E;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .word-main span {
    font-size: 10.5px; color: #9A7C63; font-weight: 600; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .word-bar.pop .word-main strong { animation: wordPop .38s cubic-bezier(.2, 1.6, .4, 1); }
  .word-listen {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(226, 190, 150, .65); background: #fff;
    color: #A86200; font-family: inherit; font-size: 12px; font-weight: 900;
    cursor: pointer; transition: transform .15s, opacity .15s;
  }
  .word-listen:disabled { opacity: .35; cursor: default; }
  .word-listen:active { transform: scale(.92); }
  @keyframes wordPop {
    0% { transform: scale(.9); opacity: .4; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }
  #game { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }

  /* 侧栏 */
  .side { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: rgba(255, 255, 255, .74);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 24px; padding: 17px 18px;
    box-shadow: 0 18px 40px rgba(150, 100, 60, .10);
  }
  .card h3 { margin: 0; font-size: 14.5px; letter-spacing: 1px; font-weight: 900; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-head span { font-size: 10px; color: #B0967F; font-weight: 700; }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .legend li {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 12px; cursor: pointer;
    font-size: 12.5px; font-weight: 700; transition: background .15s ease;
    user-select: none;
  }
  .legend li:hover { background: rgba(255, 183, 3, .12); }
  .legend li.pulse { animation: tapPulse .36s ease; }
  @keyframes tapPulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.045); background: rgba(255, 183, 3, .18); }
    100% { transform: scale(1); }
  }
  .dot {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    object-fit: cover; display: block; background: #FFF6E7;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .10);
  }
  .legend .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .legend .nm { font-size: 12.5px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .sfx { font-size: 10px; font-weight: 600; color: #A98C72; line-height: 1.2; letter-spacing: .2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .lv { font-size: 9.5px; color: #B7A08C; font-weight: 800; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .tips h3 { margin-bottom: 9px; }
  .tips ul { margin: 0; padding: 0; list-style: none; }
  .tips li {
    position: relative; padding-left: 15px; margin: 8px 0;
    font-size: 11.5px; line-height: 1.6; color: #836950; font-weight: 600;
  }
  .tips li::before {
    content: ""; position: absolute; left: 2px; top: 7px;
    width: 5px; height: 5px; border-radius: 50%;
    background: linear-gradient(135deg, #FFB703, #FF7A59);
  }

  /* 覆盖层 */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
    background: rgba(255, 246, 233, .78);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    transition: opacity .3s ease, visibility .3s ease;
  }
  .overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .overlay.editor-open {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(255, 246, 233, .9);
  }
  .panel {
    width: 100%; max-width: 372px; margin: auto;
    background: rgba(255, 255, 255, .96);
    border-radius: 26px; padding: 26px 22px 21px;
    text-align: center; border: 1px solid #fff;
    box-shadow: 0 26px 60px rgba(120, 70, 30, .2);
    animation: panelIn .36s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .eyebrow { margin: 0 0 7px; font-size: 9px; letter-spacing: 4px; color: #B79C84; font-weight: 900; }
  .panel h2 { margin: 0 0 10px; font-size: clamp(25px, 7vw, 33px); letter-spacing: 1px; font-weight: 900; }
  .panel h2 em {
    font-style: normal;
    background: linear-gradient(100deg, #FF6B6B, #FFB703, #38D9A9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .desc { margin: 0 0 16px; font-size: 12px; line-height: 1.85; color: #82674F; font-weight: 600; }
  .desc b { color: #3F2A1E; }
  .howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 18px; }
  .howto div {
    background: #FFF6E7; border-radius: 13px; padding: 9px 3px;
    font-size: 10px; color: #94785E; font-weight: 800; line-height: 1.4;
  }
  .howto b { display: block; font-size: 13px; color: #FF7A59; font-weight: 900; margin-bottom: 2px; letter-spacing: 1px; }
  .grade-picker { margin: 0 0 16px; }
  .grade-title { margin: 0 0 8px; font-size: 10.5px; letter-spacing: 1px; color: #A98C72; font-weight: 800; }
  .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .grade-btn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: 1.5px solid #EADFCF; background: #FFFCF7; border-radius: 12px;
    padding: 8px 3px; font-family: inherit; font-size: 12px; font-weight: 800;
    color: #7C614C; cursor: pointer; transition: .15s; line-height: 1.2;
  }
  .grade-btn .gm { font-size: 8.5px; font-weight: 700; color: #B0967F; letter-spacing: 0; }
  .grade-btn.active .gm { color: #C1791B; }
  .grade-btn:hover { border-color: #FFB020; background: #FFF9EC; }
  .grade-btn.active {
    border-color: #FF9F43; background: #FFF2D6; color: #A86200;
    box-shadow: 0 4px 0 rgba(255, 159, 67, .18);
  }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #DD3E5C; }
  .tiny { margin: 12px 0 0; font-size: 9.5px; color: #B79C84; line-height: 1.6; font-weight: 600; }
  .final {
    font-size: 46px; font-weight: 900; line-height: 1; margin: 0 0 8px;
    letter-spacing: 1px; font-variant-numeric: tabular-nums;
  }
  .record {
    display: inline-block; margin: 0 0 10px; padding: 4px 12px; border-radius: 999px;
    background: linear-gradient(120deg, #FFE066, #FFB703);
    color: #7A4500; font-size: 10.5px; font-weight: 900; letter-spacing: 1px;
  }
  /* 自定义关卡 / 排行榜 */
  .level-summary {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #FFF6E7; border-radius: 14px; padding: 10px 12px; margin: 0 0 12px;
    font-size: 11px; color: #8A6B50; font-weight: 700; line-height: 1.5; text-align: left;
  }
  .level-summary b { color: #A86200; }
  .btn.mini { padding: 7px 12px; font-size: 11px; box-shadow: none; flex: none; }
  .nick-row { margin: 0 0 12px; }
  .nick-row input {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12px; font-weight: 700;
    color: #5A4231; background: #FFFCF7; border: 1.5px solid #EADFCF; border-radius: 12px;
    padding: 10px 12px; outline: none;
  }
  .nick-row input:focus { border-color: #FFB020; background: #FFF9EC; }
  .editor-panel, .rank-panel {
    max-width: 430px; max-height: calc(100% - 8px); overflow-y: auto;
    -webkit-overflow-scrolling: touch; text-align: left;
  }
  .editor-panel h2, .editor-panel .eyebrow, .editor-panel .desc,
  .rank-panel h2, .rank-panel .eyebrow, .rank-panel .desc { text-align: center; }
  .preset-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 12px; }
  .preset-btn {
    font-family: inherit; font-size: 12px; font-weight: 900; color: #7C614C;
    background: #FFFCF7; border: 1.5px solid #EADFCF; border-radius: 10px;
    padding: 7px 12px; cursor: pointer; transition: .15s;
  }
  .preset-btn:hover { border-color: #FFB020; background: #FFF9EC; }
  .preset-btn.active {
    border-color: #FF9F43; background: #FFF2D6; color: #A86200;
    box-shadow: 0 3px 0 rgba(255, 159, 67, .18);
  }
  .order-list {
    display: flex; flex-direction: column; gap: 5px; margin: 0 0 12px;
    max-height: 30vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .order-row {
    display: flex; align-items: center; gap: 8px;
    background: #FFFCF7; border: 1px solid #F0E6D8; border-radius: 11px; padding: 4px 8px;
  }
  .order-lv { flex: none; width: 36px; font-size: 9.5px; font-weight: 900; color: #B0967F; }
  .order-row img { width: 26px; height: 26px; border-radius: 50%; flex: none; background: #FFF1D8; }
  .order-row select {
    flex: 1; min-width: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; color: #5A4231;
    background: transparent; border: 0; outline: none; padding: 6px 0; cursor: pointer;
  }
  .editor-actions {
    margin-top: 4px; padding-top: 8px; border-top: 1px solid #F3E9DB;
  }
  .editor-actions .btn { width: 100%; }
  .editor-actions-row { display: flex; gap: 8px; margin-top: 8px; }
  .editor-actions-row .btn { flex: 1; }
  .rank-list { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
  .rank-row {
    display: flex; align-items: center; gap: 9px;
    background: #FFFCF7; border: 1px solid #F0E6D8; border-radius: 12px; padding: 8px 10px;
  }
  .rank-row.me { border-color: #FF9F43; background: #FFF2D6; }
  .rank-no { flex: none; width: 24px; text-align: center; font-size: 12px; font-weight: 900; color: #B0967F; }
  .rank-no.top { color: #E8A000; }
  .rank-name {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 800; color: #4F3A2A;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-meta { flex: none; font-size: 8.5px; font-weight: 700; color: #B0967F; }
  .rank-score { flex: none; font-size: 15px; font-weight: 900; color: #FF7A59; font-variant-numeric: tabular-nums; }
  .rank-empty { text-align: center; font-size: 11.5px; color: #B0967F; padding: 18px 0; font-weight: 700; }
  .rank-note {
    background: #F6F1E9; border-radius: 10px; padding: 8px 10px; margin: 0 0 12px;
    font-size: 9px; line-height: 1.7; color: #9C8369; font-weight: 600;
  }
  /* 英语单词奖励题 */
  .quiz-panel {
    max-width: 430px; text-align: left; padding: 22px 20px 20px;
    max-height: calc(100% - 8px); overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .quiz-head { text-align: center; margin-bottom: 14px; }
  .quiz-head h2 { margin: 4px 0 8px; }
  .quiz-meta { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .quiz-subject {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    background: #FFF2D6; color: #A86200; font-size: 10.5px; font-weight: 900; letter-spacing: 1px;
  }
  .quiz-reward {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: #E9FBF4; color: #0B8A68; font-size: 10.5px; font-weight: 800;
  }
  .quiz-passage {
    background: #FFF8EC; border: 1px solid #F3E4CF; border-radius: 14px;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.85; color: #6F5843; margin-bottom: 12px;
  }
  .quiz-question { margin: 0 0 12px; font-size: 14px; line-height: 1.7; font-weight: 800; color: #3F2A1E; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    font-family: inherit; font-size: 12.5px; line-height: 1.55; color: #55402F;
    background: #FFFCF7; border: 1.5px solid #EADFCF; border-radius: 13px;
    padding: 10px 12px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .quiz-option b {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: #FFF1D8; color: #B26A00;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .quiz-option span { flex: 1; }
  .quiz-option:hover { border-color: #FFC46B; background: #FFF8EA; }
  .quiz-option.selected { border-color: #FFB020; background: #FFF4DE; transform: translateY(-1px); }
  .quiz-option.correct { border-color: #38D9A9; background: #E9FBF4; }
  .quiz-option.wrong { border-color: #FF8787; background: #FFF1F0; }
  .quiz-option:disabled { cursor: default; }
  .quiz-input {
    width: 100%; font-family: inherit; font-size: 14px; color: #3F2A1E;
    background: #FFFCF7; border: 1.5px solid #EADFCF; border-radius: 13px;
    padding: 12px 14px; outline: none; transition: border-color .15s;
  }
  .quiz-input:focus { border-color: #FFB020; }
  .quiz-input.invalid { border-color: #FF8787; background: #FFF6F5; }
  .quiz-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .quiz-panel .btn.primary { padding: 12px 24px; font-size: 14px; letter-spacing: 2px; }
  .quiz-submit:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #DD3E5C; }
  .quiz-skip {
    border: 0; background: none; color: #B0967F; font-family: inherit;
    font-size: 11px; font-weight: 700; cursor: pointer; padding: 6px 2px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .quiz-feedback { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: 11.5px; line-height: 1.7; }
  .quiz-feedback.ok { background: #EDFBF5; border: 1px solid #B2F2DD; color: #0B7A5E; }
  .quiz-feedback.bad { background: #FFF4F2; border: 1px solid #FFD3CC; color: #A33A2C; }
  .quiz-feedback p { margin: 5px 0 0; color: #765C47; }
  .quiz-feedback .quiz-result { font-size: 13px; font-weight: 900; }
  .quiz-next { margin-top: 14px; width: 100%; }
  footer {
    margin-top: 26px; text-align: center;
    font-size: 9.5px; letter-spacing: 1px; color: #B7A08C; font-weight: 600;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 540px); }
    .side { flex-direction: row; flex-wrap: wrap; }
    .side .card { flex: 1 1 260px; }

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="orb" aria-hidden="true"></div>
      <div>
        <h1>合成<em>小马</em></h1>
        <p class="sub">小马伙伴 · 边玩边学英语</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="soundBtn" type="button">声音：开</button>
      <button class="btn ghost" id="rankBtn" type="button">排行榜</button>
      <button class="btn" id="restartBtn" type="button">重开一局</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="hud">
        <div class="score-box">
          <span class="label">分数</span>
          <strong class="score" id="scoreVal">0</strong>
          <span class="best">最高 <b id="bestVal">0</b></span>
        </div>
        <div class="next-box">
          <div>
            <span class="label">下一个</span>
            <span class="next-name" id="nextName">—</span>
          </div>
          <canvas id="nextCanvas" width="72" height="72"></canvas>
        </div>
      </div>
      <div class="word-bar" id="wordBar">
        <span class="word-grade" id="wordGrade">选择年级</span>
        <div class="word-main">
          <strong id="wordEn">Ready?</strong>
          <span id="wordCn">先选择年级，再开始合成</span>
        </div>
        <button class="word-listen" id="wordListen" type="button" title="再听一遍" disabled>听</button>
      </div>
      <canvas id="game" width="540" height="640" aria-label="合成小马游戏区域"></canvas>
      <div class="overlay" id="overlay" aria-live="polite"></div>
    </section>

    <aside class="side">
      <div class="card">
        <div class="card-head">
          <h3>小马图鉴</h3>
          <span>点名字听英文</span>
        </div>
        <ul class="legend" id="legend"></ul>
      </div>
      <div class="card tips">
        <h3>玩法须知</h3>
        <ul>
          <li>先选择年级，再按住小球蓄力、拖动瞄准，松手发射</li>
          <li>蓄力越久初速越大，屏幕上会实时显示质量与初速</li>
          <li>球与球是完全弹性碰撞：大球质量大，小球质量小</li>
          <li>同款伙伴相撞会合成下一位，撞墙会等速反弹</li>
          <li>每次合成都学一个英语单词，并自动朗读</li>
          <li>合出最高级伙伴奖励一道单词题；堆过危险线会爆盆</li>
        </ul>
      </div>
    </aside>
  </main>

  <footer>小学 + 初中英语核心词汇 · 儿童益智小游戏 · 角色原声版权归原权利人所有</footer>
</div>

  function makeRadii(n) {
    const maxR = n <= 7 ? 66 : (n <= 9 ? 73 : (n <= 12 ? 82 : 90));
    const out = [];
    for (let i = 0; i < n; i++) {

    const top = n <= 9 ? 4 : (n <= 12 ? 5 : 6);

      if (lv <= 2) pool.push(lv);

    const seen = Object.create(null);

        out.push(key);

    const fallback = defaultOrder(n);
    for (let i = 0; out.length < n; i++) {

      if (!seen[key]) {

        out.push(key);
      }

  /* ================= 工具 ================= */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  function rgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function mix(hex, target, amt) {
    const a = rgb(hex), b = rgb(target);
    return 'rgb(' + Math.round(a.r + (b.r - a.r) * amt) + ', ' +
      Math.round(a.g + (b.g - a.g) * amt) + ', ' +
      Math.round(a.b + (b.b - a.b) * amt) + ')';
  }
  function rr(c, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rad, y);
    c.arcTo(x + w, y, x + w, y + h, rad);
    c.arcTo(x + w, y + h, x, y + h, rad);
    c.arcTo(x, y + h, x, y, rad);
    c.arcTo(x, y, x + w, y, rad);
    c.closePath();
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // 世界高度可变：每合成一个终极伙伴，瓶身向下延长

  function floorY() { return PLAY.floor + worldGrow(); }

  // 蓄力越久初速越大（平方增长），达到上限后不再增加
  function chargeSpeed(t) {
    return Math.min(MAX_LAUNCH, CHARGE_BASE + CHARGE_LINEAR * t + CHARGE_QUAD * t * t);

  function ballMass(level) {

  /* ================= 声音 ================= */
  // 游戏不使用玩梗音效；合成时朗读所选年级的英语单词。
  let AC = null;
  let master = null;
  let noiseBuf = null;
  let muted = load('dhw_muted') === '1';
  let voices = [];
  let speechSeq = 0;
  let ttsAudio = null;
  const TTS_BASE = 'https://dict.youdao.com/dictvoice?type=2&audio=';

  function ensureAudio() {
    if (muted) return;
    try {
      if (!AC) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        AC = new Ctx();
        master = AC.createGain();
        master.gain.value = 0.55;
        master.connect(AC.destination);
        const len = Math.floor(AC.sampleRate * 0.5);
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
    } catch (e) {}
  }

  function refreshVoices() {
    const ss = window.speechSynthesis;
    if (!ss) return;
    let all = [];
    try { all = ss.getVoices() || []; } catch (e) { all = []; }
    voices = all.filter(function (v) {
      return /^en/i.test(v.lang) || /english/i.test(v.name);
    });
  }

  if (window.speechSynthesis) {
    try {
      window.speechSynthesis.onvoiceschanged = refreshVoices;
      refreshVoices();
    } catch (e) {}
  }

  function pickEnglishVoice() {
    if (!voices.length) return null;
    for (let i = 0; i < voices.length; i++) {
      if (/^en-US/i.test(voices[i].lang) || /Samantha|Aria|Jenny|Google US English/i.test(voices[i].name)) {
        return voices[i];
      }
    }
    return voices[0];
  }

  function getTtsAudio() {
    if (!ttsAudio) {
      ttsAudio = new Audio();
      ttsAudio.preload = 'auto';
      ttsAudio.volume = 0.72;
      ttsAudio.setAttribute('playsinline', '');
      ttsAudio.style.display = 'none';
      try { document.body.appendChild(ttsAudio); } catch (e) {}
    }
    return ttsAudio;
  }

  // 统一优先播放在线词典发音，失败时自动切换到系统语音
  function playDictWord(text, onDone, onFail) {
    if (muted) { onDone(); return; }
    let a;
    try { a = getTtsAudio(); } catch (e) { onFail(); return; }
    let settled = false;
    let timer = 0;
    const done = function () {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      if (a.onended === done) a.onended = null;
      if (a.onerror === fail) a.onerror = null;
      onDone();
    };
    const fail = function () {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      if (a.onended === done) a.onended = null;
      if (a.onerror === fail) a.onerror = null;
      onFail();
    };
    a.onended = done;
    a.onerror = fail;
    try {
      a.src = TTS_BASE + encodeURIComponent(text);
      try { a.currentTime = 0; } catch (e) {}
      const p = a.play();
      if (p && p.catch) p.catch(fail);
    } catch (e) { fail(); return; }
    timer = setTimeout(done, 4200);
  }

  function playSynthWord(text, onDone, onFail) {
    const ss = window.speechSynthesis;
    if (!ss) { onFail(); return; }
    if (muted) { onDone(); return; }
    let started = false;
    let settled = false;
    let startTimer = 0;
    let hardTimer = 0;
    const cleanup = function () {
      if (startTimer) clearTimeout(startTimer);
      if (hardTimer) clearTimeout(hardTimer);
    };
    const done = function () {
      if (settled) return;
      settled = true;
      cleanup();
      onDone();
    };
    const fail = function () {
      if (settled) return;
      settled = true;
      cleanup();
      onFail();
    };
    try {
      if (ss.speaking || ss.pending) ss.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      u.pitch = 1.05;
      u.volume = 0.95;
      const v = pickEnglishVoice();
      if (v) u.voice = v;
      u.onstart = function () {
        started = true;
        if (startTimer) { clearTimeout(startTimer); startTimer = 0; }
      };
      u.onend = done;
      u.onerror = function () { if (!started) fail(); else done(); };
      ss.speak(u);
      startTimer = setTimeout(function () { if (!started) fail(); }, 1250);
      hardTimer = setTimeout(done, 3600);
    } catch (e) { fail(); }
  }

  function speakEnglish(text, done) {
    if (!text) { if (done) done(false); return; }
    if (muted) { setTimeout(function () { if (done) done(false); }, 220); return; }
    const seq = ++speechSeq;
    let settled = false;
    const finish = function (ok) {
      if (settled || seq !== speechSeq) return;
      settled = true;
      if (done) done(ok);
    };
    const useSynth = function () {
      if (seq !== speechSeq) return;
      playSynthWord(text, function () { finish(true); }, function () { finish(false); });
    };
    const useDict = function () {
      if (seq !== speechSeq) return;
      playDictWord(text, function () { finish(true); }, useSynth);
    };
    useDict();
  }

  function cancelSpeech() {
    speechSeq++;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    try {
      if (ttsAudio) {
        ttsAudio.onended = null;
        ttsAudio.onerror = null;
        ttsAudio.pause();
      }
    } catch (e) {}
  }

  function tone(freq, end, type, dur, vol, delay) {
    if (!AC || muted) return;
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function noise(dur, vol, freq, q, delay) {
    if (!AC || muted || !noiseBuf) return;
    const t = AC.currentTime + (delay || 0);
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    const f = AC.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t);
    src.stop(t + dur + 0.03);
  }

  function playLaunch(power) {
    noise(0.12, 0.05 + power * 0.06, 700 + power * 900, 1.4, 0);
    tone(160 + power * 180, 70, 'triangle', 0.16, 0.05 + power * 0.04, 0);
  }

  function playMerge(level) {
    if (!AC || muted) return;
    tone(300 + level * 30, 140 + level * 8, 'sine', 0.12, 0.045, 0);
    tone(620 + level * 36, 320 + level * 16, 'triangle', 0.08, 0.022, 0.015);
  }

  function playStartChime() {
    if (!AC || muted) return;

  function playKing() {

      [523, 659, 784, 1047].forEach(function (f, i) {

  function playOver() {

  function setMuted(m) {
    muted = !!m;
    store('dhw_muted', muted ? '1' : '0');
    if (master) master.gain.value = muted ? 0 : 0.55;
    if (muted) {
      cancelSpeech();
      stopCharVoices();
      state.wordBusy = false;
      state.wordQueue = [];
    }
    soundBtn.textContent = muted ? '声音：关' : '声音：开';
    soundBtn.classList.toggle('muted', muted);
    if (!muted) ensureAudio();

  /* ================= 角色原声 ================= */
  const charBuffers = Object.create(null);
  const charPromises = Object.create(null);
  let charVoices = [];

  function stopCharVoices() {
    for (let i = 0; i < charVoices.length; i++) {
      try { charVoices[i].source.stop(); } catch (e) {}
      try { charVoices[i].gain.disconnect(); } catch (e) {}
    }
    charVoices = [];
  }

  function playCharVoice(charKey, done) {
    if (muted) { if (done) done(); return; }
    const list = CHAR_AUDIO[charKey];
    if (!list || !list.length) { if (done) done(); return; }
    cancelSpeech();
    state.wordBusy = false;
    state.wordQueue = [];
    ensureAudio();
    if (!AC) { if (done) done(); return; }
    const token = state.voiceToken;
    const idx = Math.floor(Math.random() * list.length);
    const cacheKey = charKey + ':' + idx;

    const play = function (buffer) {
      if (token !== state.voiceToken) { if (done) done(); return; }
      if (muted || !AC) { if (done) done(); return; }
      try {
        const source = AC.createBufferSource();
        const gain = AC.createGain();
        gain.gain.value = 0.9;
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(master || AC.destination);
        const item = { source: source, gain: gain };
        charVoices.push(item);
        source.onended = function () {
          const pos = charVoices.indexOf(item);
          if (pos >= 0) charVoices.splice(pos, 1);
          try { gain.disconnect(); } catch (e) {}
          if (done) done();
        };
        source.start(0);
      } catch (e) {
        if (done) done();
      }
    };

    if (charBuffers[cacheKey]) { play(charBuffers[cacheKey]); return; }
    if (!charPromises[cacheKey]) {
      charPromises[cacheKey] = fetch(list[idx])
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          return new Promise(function (resolve, reject) {
            AC.decodeAudioData(ab, resolve, reject);
          });
        })
        .then(function (buf) {
          charBuffers[cacheKey] = buf;
          return buf;
        })
        .catch(function (err) {
          delete charPromises[cacheKey];
          throw err;
        });
    }
    charPromises[cacheKey].then(play).catch(function () {
      if (done) done();
    });
  }

  /* ================= 图鉴 ================= */
  function buildLegend() {
    legendEl.innerHTML = '';
    LEVELS.forEach(function (lv, i) {
      const li = document.createElement('li');
      const dot = document.createElement('img');

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  const LEARN_KEY = 'dhw_learn_v1';
  // 艾宾浩斯复习间隔：5分钟 → 30分钟 → 12小时 → 1天 → 2天 → 4天 → 7天 → 15天 → 30天
  const REVIEW_STEPS = [0, 5 * 60e3, 30 * 60e3, 12 * 3600e3, 24 * 3600e3, 2 * 864e5, 4 * 864e5, 7 * 864e5, 15 * 864e5, 30 * 864e5];
  let learnCache = null;

  function loadLearn() {
    if (learnCache) return learnCache;
    try {
      learnCache = JSON.parse(load(LEARN_KEY) || '{}') || {};
      if (typeof learnCache !== 'object' || Array.isArray(learnCache)) learnCache = {};
    } catch (e) { learnCache = {}; }
    return learnCache;
  }

  function saveLearn() {
    try { store(LEARN_KEY, JSON.stringify(learnCache || {})); } catch (e) {}
  }

  function wordKey(grade, w) {
    return grade + '|' + String(w.en).toLowerCase();
  }

  function wordDueAt(rec) {
    const stage = Math.min(rec.stage || 0, REVIEW_STEPS.length - 1);
    return (rec.last || 0) + REVIEW_STEPS[stage];
  }

  function noteWordShown(grade, w) {
    const data = loadLearn();
    const key = wordKey(grade, w);
    const rec = data[key] || { seen: 0, right: 0, wrong: 0, stage: 0, last: 0 };
    rec.seen += 1;
    rec.stage = Math.min((rec.stage || 0) + 1, REVIEW_STEPS.length - 1);
    rec.last = Date.now();
    data[key] = rec;
    saveLearn();
  }

  function noteQuizResult(grade, w, correct) {
    if (!w) return;
    const data = loadLearn();
    const key = wordKey(grade, w);
    const rec = data[key] || { seen: 0, right: 0, wrong: 0, stage: 0, last: 0 };
    if (correct) {
      rec.right = (rec.right || 0) + 1;
      rec.stage = Math.min((rec.stage || 0) + 2, REVIEW_STEPS.length - 1);
    } else {
      rec.wrong = (rec.wrong || 0) + 1;
      rec.stage = 0;
    }
    rec.last = Date.now();
    data[key] = rec;
    saveLearn();
  }

  function learnedCount(grade) {
    const bank = WORD_BANKS[grade] || [];
    const data = loadLearn();
    let n = 0;
    for (let i = 0; i < bank.length; i++) {
      const rec = data[wordKey(grade, bank[i])];
      if (rec && rec.seen > 0) n++;
    }
    return n;
  }

  function pickWordCandidate(grade) {
    const bank = WORD_BANKS[grade] || WORD_BANKS[1];
    const data = loadLearn();
    const now = Date.now();
    const fresh = [];
    const due = [];
    const later = [];
    for (let i = 0; i < bank.length; i++) {
      const w = bank[i];
      if (bank.length > 1 && w.en === state.lastPickedEn) continue;
      const rec = data[wordKey(grade, w)];
      if (!rec || !rec.seen) {
        fresh.push(w);
      } else {
        const at = wordDueAt(rec);
        if (now >= at) due.push({ w: w, at: at });
        else later.push({ w: w, at: rec.last || 0 });
      }
    }
    let target;
    if (fresh.length) {
      target = pick(fresh);
    } else if (due.length) {
      due.sort(function (a, b) { return a.at - b.at; });
      target = due[0].w;
    } else if (later.length) {
      later.sort(function (a, b) { return a.at - b.at; });
      target = later[0].w;
    } else {
      target = pick(bank);
    }
    const rec = data[wordKey(grade, target)];
    state.lastPickedEn = target.en;
    return { en: target.en, cn: target.cn, fresh: !rec || !rec.seen };
  }

  function pickLearningWord() {
    const grade = state.grade || 1;
    const item = pickWordCandidate(grade);
    noteWordShown(grade, item);
    return item;
  }

  function showWord(w) {
    state.currentWord = w;
    wordEn.textContent = w.en;
    wordCn.textContent = w.cn;
    wordGrade.textContent = w.gradeLabel || (state.grade
      ? GRADE_LABELS[state.grade] + (w.fresh ? ' · 新词' : ' · 复习')
      : '英语单词');
    wordListen.disabled = false;
    wordBar.classList.remove('pop');
    void wordBar.offsetWidth;
    wordBar.classList.add('pop');
  }

  function pumpWords() {
    if (state.wordBusy || !state.wordQueue.length) return;
    if (state.mode !== 'playing') return;
    const w = state.wordQueue.shift();
    state.wordBusy = true;
    showWord(w);
    speakEnglish(w.en, function () {
      state.wordBusy = false;
      setTimeout(pumpWords, 220);
    });
  }

  function queueLearningWord() {
    if (!state.grade) return;
    state.wordQueue.push(pickLearningWord());
    if (state.wordQueue.length > 6) state.wordQueue.shift();
    pumpWords();
  }

  function resetWordQueue() {
    state.wordQueue = [];
    state.wordBusy = false;
    state.currentWord = null;
    cancelSpeech();
    wordListen.disabled = true;
    wordGrade.textContent = state.grade ? GRADE_LABELS[state.grade] + '单词' : '选择年级';
    wordEn.textContent = 'Ready?';
    wordCn.textContent = state.grade ? '合并小马，学习英语' : '先选择年级，再开始合成';
  }

  function speakPonyName(lv) {
    ensureAudio();
    resetWordQueue();
    if (muted) {
      showWord({ en: lv.en, cn: lv.name, gradeLabel: '小马名字' });
      return;
    }
    showWord({ en: lv.en, cn: lv.name, gradeLabel: '小马名字' });
    state.wordBusy = true;
    speakEnglish(lv.en, function () {
      state.wordBusy = false;
      setTimeout(pumpWords, 200);
    });
  }

  /* ================= 英语奖励题 ================= */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function normalizeAnswer(s) {
    return String(s || '')
      .trim()
      .toLowerCase()
      .replace(/[\s，。！？、；：""''（）()「」【】,!?;:]/g, '')
      .replace(/\.$/, '');
  }


  function playQuizCorrect() {
    if (!AC || muted) return;
    [523, 659, 784, 1047].forEach(function (f, i) {
      tone(f, f, 'triangle', 0.16, 0.06, i * 0.08);
    });
  }

  function playQuizWrong() {
    if (!AC || muted) return;
    tone(220, 180, 'sine', 0.18, 0.05, 0);
    tone(160, 120, 'sine', 0.22, 0.05, 0.12);
  }

    html += '<div class="quiz-meta"><span class="quiz-subject">' + esc(q.subject) + '</span><span class="quiz-reward">答对 +300 分</span></div>';

  function makeWordQuiz() {
    const grade = state.grade || 1;
    const bank = WORD_BANKS[grade] || WORD_BANKS[1];
    let target = null;
    const cur = state.currentWord;
    if (cur && cur.en && !cur.gradeLabel && cur.en !== state.lastQuizWord) {
      for (let i = 0; i < bank.length; i++) {
        if (bank[i].en === cur.en) {
          target = { en: bank[i].en, cn: bank[i].cn };
          break;
        }
      }
    }
    if (!target) {
      const picked = pickWordCandidate(grade);
      noteWordShown(grade, picked);
      target = { en: picked.en, cn: picked.cn };
    }
    state.quizWord = target;
    state.lastQuizWord = target.en;

    const en2cn = Math.random() < 0.5;
    const correct = en2cn ? target.cn : target.en;
    const options = [correct];
    const pool = shuffleArray(bank.slice());
    for (let i = 0; i < pool.length && options.length < 4; i++) {
      const v = en2cn ? pool[i].cn : pool[i].en;
      if (v !== correct && options.indexOf(v) === -1) options.push(v);
    }
    shuffleArray(options);
    return {
      subject: '英语 · ' + GRADE_LABELS[grade],
      type: 'choice',
      q: en2cn ? '“' + target.en + '” 的中文意思是？' : '“' + target.cn + '” 的英文是？',
      options: options,
      answer: options.indexOf(correct),
      explain: target.en + ' = ' + target.cn,
      word: target
    };
  }

  function bindQuiz(q) {
    let selected = -1;
    let answered = false;
    const submit = document.getElementById('quizSubmit');
    const skip = document.getElementById('quizSkip');
    const next = document.getElementById('quizNext');
    const feedback = document.getElementById('quizFeedback');

    function finish(correct, skipped) {
      if (answered) return;
      answered = true;
      state.quizAnswered = true;

      if (q.type === 'choice') {
        const opts = Array.from(document.querySelectorAll('.quiz-option'));
        opts.forEach(function (btn) {
          const i = +btn.dataset.i;
          btn.disabled = true;
          if (i === q.answer) btn.classList.add('correct');
          if (i === selected && !correct) btn.classList.add('wrong');
        });
      } else {
        const input = document.getElementById('quizInput');
        if (input) input.disabled = true;
      }

      if (correct) {
        state.score += 300;
        updateScoreUI(true);
        playQuizCorrect();
        noteQuizResult(state.grade, q.word, true);
      } else {
        playQuizWrong();
        if (!skipped) noteQuizResult(state.grade, q.word, false);
      }

      const answerText = q.type === 'choice' ? q.options[q.answer] : q.answer;
      feedback.style.display = 'block';
      feedback.className = 'quiz-feedback ' + (correct ? 'ok' : 'bad');
      feedback.innerHTML =
        '<strong class="quiz-result">' +
          (correct ? '答对了！+300 分' : (skipped ? '已跳过' : '答错了')) +
        '</strong>' +
        '<p>正确答案：' + esc(answerText) + '</p>' +
        '<p>' + esc(q.explain) + '</p>';

      document.querySelector('.quiz-actions').style.display = 'none';
      next.style.display = 'inline-block';
      next.focus();
    }

    if (q.type === 'choice') {
      const opts = Array.from(document.querySelectorAll('.quiz-option'));
      opts.forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (answered) return;
          selected = +btn.dataset.i;
          opts.forEach(function (o) { o.classList.toggle('selected', o === btn); });
          submit.disabled = false;
        });
      });
      submit.addEventListener('click', function () {
        if (selected < 0) return;
        finish(selected === q.answer, false);
      });
    } else {
      const input = document.getElementById('quizInput');
      submit.addEventListener('click', function () {
        if (!input) return;
        const value = normalizeAnswer(input.value);
        if (!value) {
          input.classList.add('invalid');
          input.focus();
          return;
        }
        const ok = q.accept.some(function (a) { return normalizeAnswer(a) === value; });
        finish(ok, false);
      });
      if (input) {
        input.addEventListener('input', function () { input.classList.remove('invalid'); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            submit.click();
          }
        });
        setTimeout(function () { input.focus(); }, 60);
      }
    }

    skip.addEventListener('click', function () { finish(false, true); });
    next.addEventListener('click', function () { resumeAfterQuiz(); });
  }

  function openQuiz() {
    if (state.mode !== 'playing') return;
    state.mode = 'quiz';
    state.pointerDown = false;
    state.aiming = false;
    state.aimDx = 0;
    state.aimDy = 0;
    state.aimPower = 0;
    state.quizAnswered = false;
    state.quizCurrent = makeWordQuiz();
    resetWordQueue();
    overlayEl.innerHTML = renderQuiz(state.quizCurrent);
    overlayEl.classList.remove('hide');
    bindQuiz(state.quizCurrent);
  }

  function resumeAfterQuiz() {
    const lastWord = state.quizWord;
    state.quizCurrent = null;
    state.quizAnswered = false;
    state.mode = 'playing';
    state.danger = 0;
    state.pointerDown = false;
    state.aiming = false;
    state.aimDx = 0;
    state.aimDy = 0;
    state.aimPower = 0;
    state.lastDrop = state.time - 1;
    overlayEl.classList.add('hide');
    if (lastWord) showWord({ en: lastWord.en, cn: lastWord.cn, fresh: false });
  }

  /* ================= 渲染：小球 ================= */
  function drawBall(c, b, alpha) {
    const def = LEVELS[b.level - 1];
    const pop = b.pop || 0;
    const sqX = b.sqX || 0;
    const sqY = b.sqY || 0;
    const rx = Math.max(1, b.r * (1 + pop * 0.16 + sqX));
    const ry = Math.max(1, b.r * (1 - pop * 0.16 + sqY));

    c.save();
    c.globalAlpha = alpha === undefined ? 1 : alpha;
    const ix = b.prevX === undefined ? b.x : b.prevX + (b.x - b.prevX) * state.alpha;
    const iy = b.prevY === undefined ? b.y : b.prevY + (b.y - b.prevY) * state.alpha;
    c.translate(ix, iy);

    // 高速运动拖影
    const spd = Math.hypot(b.vx || 0, b.vy || 0);
    if (spd > 450) {
      const len = Math.min(52, spd * 0.04);
      const ux = (b.vx || 0) / spd;
      const uy = (b.vy || 0) / spd;
      c.save();
      c.globalAlpha *= 0.22;
      c.strokeStyle = def.color;
      c.lineWidth = Math.max(2, b.r * 0.5);
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-ux * len, -uy * len);
      c.lineTo(0, 0);
      c.stroke();
      c.restore();
    }

    // 落影
    c.fillStyle = 'rgba(110, 75, 45, .10)';
    c.beginPath();
    c.ellipse(0, ry * 0.98, rx * 0.74, ry * 0.13, 0, 0, TAU);
    c.fill();

    // 终极光晕（最高级伙伴）
    if (b.level === LEVELS.length) {
      c.save();
      c.shadowColor = 'rgba(150, 180, 255, .95)';
      c.shadowBlur = Math.max(10, rx * 0.55);
      c.fillStyle = 'rgba(245, 248, 255, .92)';
      c.beginPath();
      c.ellipse(0, 0, rx * 1.02, ry * 1.02, 0, 0, TAU);
      c.fill();
      c.restore();
    }

    // 角色球（3D 盲盒图片）
    const img = PONY_IMG[def.key];
    c.save();
    c.beginPath();
    c.ellipse(0, 0, rx, ry, 0, 0, TAU);
    c.clip();
    if (img && img.complete && img.naturalWidth) {
      c.drawImage(img, -rx, -ry, rx * 2, ry * 2);
    } else {
      const g = c.createRadialGradient(-rx * 0.34, -ry * 0.4, rx * 0.08, 0, 0, rx * 1.08);
      g.addColorStop(0, mix(def.color, '#FFFFFF', 0.62));
      g.addColorStop(0.55, def.color);
      g.addColorStop(1, mix(def.color, '#000000', 0.24));
      c.fillStyle = g;
      c.fillRect(-rx, -ry, rx * 2, ry * 2);
    }
    // 底部轻微暗面，增强落地感
    const sg = c.createLinearGradient(0, ry * 0.4, 0, ry * 1.02);
    sg.addColorStop(0, 'rgba(0,0,0,0)');
    sg.addColorStop(1, 'rgba(70, 40, 20, .14)');
    c.fillStyle = sg;
    c.fillRect(-rx, -ry, rx * 2, ry * 2);
    // 顶部光泽
    c.globalAlpha *= 0.5;
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath();
    c.ellipse(-rx * 0.4, -ry * 0.5, rx * 0.2, ry * 0.085, -0.6, 0, TAU);
    c.fill();
    c.restore();

    // 外圈
    c.beginPath();
    c.ellipse(0, 0, Math.max(1, rx - 0.6), Math.max(1, ry - 0.6), 0, 0, TAU);
    c.lineWidth = Math.max(1, rx * 0.035);
    c.strokeStyle = 'rgba(255,255,255,.42)';
    c.stroke();

    // 最高级伙伴星环
    if (b.level === LEVELS.length) {
      c.save();
      c.lineWidth = Math.max(1.5, rx * 0.035);
      c.lineCap = 'round';
      const stars = ['#FFFFFF', '#FFE066', '#B197FC'];
      for (let i = 0; i < 3; i++) {
        c.strokeStyle = stars[i];
        c.globalAlpha = 0.55;
        c.beginPath();
        c.ellipse(0, 0, rx * 0.92, ry * 0.92, 0,
          i * (TAU / 3) + state.time * 0.45,
          i * (TAU / 3) + TAU / 3 * 0.6 + state.time * 0.45);
        c.stroke();
      }
      c.restore();
    }

    c.restore();
  }

  function drawNote(c, x, y, s, color) {
    c.save();
    c.translate(x, y);
    c.rotate(-0.18);
    c.fillStyle = color;
    c.beginPath();
    c.ellipse(0, 0, s * 0.55, s * 0.42, -0.2, 0, TAU);
    c.fill();
    c.fillRect(s * 0.32, -s * 2.1, s * 0.17, s * 2.1);
    c.beginPath();
    c.moveTo(s * 0.49, -s * 2.1);
    c.quadraticCurveTo(s * 1.2, -s * 1.7, s * 0.6, -s * 1.1);
    c.lineTo(s * 0.49, -s * 1.4);
    c.closePath();
    c.fill();
    c.restore();
  }

  function drawAim(c, t) {
    const level = state.current;
    const def = LEVELS[level - 1];
    const r = RADII[level - 1];
    const x = clamp(state.aimX, PLAY.left + r, PLAY.right - r);
    const y0 = Math.max(DROP_Y, r + 2);
    const v = getLaunchVelocity();
    const aiming = state.aiming;

    if (!aiming) {
      const yTop = y0 + r + 5;
      const g = c.createLinearGradient(0, yTop, 0, floorY());
      g.addColorStop(0, 'rgba(120, 90, 65, .30)');
      g.addColorStop(1, 'rgba(120, 90, 65, 0)');
      c.save();
      c.setLineDash([5, 9]);
      c.lineDashOffset = -t * 40;
      c.strokeStyle = g;
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(x, yTop);
      c.lineTo(x, floorY() - 8);
      c.stroke();
      c.restore();
    }

    // 反弹轨迹预览
    if (aiming) {
      let px = x;
      let py = y0;
      let vx = v.vx;
      let vy = v.vy;
      const dt = 1 / 90;
      const pts = [[px, py]];
      for (let i = 0; i < 115; i++) {
        vy += GRAVITY * dt;
        px += vx * dt;
        py += vy * dt;
        if (px - r < PLAY.left) { px = PLAY.left + r; vx = Math.abs(vx); }
        else if (px + r > PLAY.right) { px = PLAY.right - r; vx = -Math.abs(vx); }
        if (py - r < 2) { py = 2 + r; if (vy < 0) vy = -vy; }
        if (py + r > floorY()) { py = floorY() - r; pts.push([px, py]); break; }
        pts.push([px, py]);
      }
      c.save();
      c.strokeStyle = mix(def.color, '#000000', 0.12);
      c.lineWidth = 2.2;
      c.lineCap = 'round';
      c.setLineDash([1, 8]);
      c.globalAlpha = 0.55;
      c.beginPath();
      for (let i = 0; i < pts.length; i++) {
        if (i === 0) c.moveTo(pts[i][0], pts[i][1]);
        else c.lineTo(pts[i][0], pts[i][1]);
      }
      c.stroke();
      c.restore();
    }

    // 力度环
    if (state.aiming) {
      c.save();
      c.beginPath();
      c.arc(x, y0, r + 7, 0, TAU);
      c.strokeStyle = 'rgba(255,255,255,.45)';
      c.lineWidth = 3;
      c.stroke();
      c.beginPath();
      c.arc(x, y0, r + 7, -Math.PI / 2, -Math.PI / 2 + TAU * v.power);
      c.strokeStyle = mix(def.color, '#000000', 0.08);
      c.lineWidth = 4;
      c.lineCap = 'round';
      c.stroke();
      c.restore();
    }

    // 发射方向箭头
    if (aiming) {
      const a = v.angle;
      const startR = r + 9;
      const len = 26 + v.power * 46;
      const sx = x + Math.cos(a) * startR;
      const sy = y0 + Math.sin(a) * startR;
      const ex = x + Math.cos(a) * (startR + len);
      const ey = y0 + Math.sin(a) * (startR + len);
      const col = mix(def.color, '#000000', 0.08);
      c.save();
      c.strokeStyle = col;
      c.fillStyle = col;
      c.lineWidth = 4;
      c.lineCap = 'round';
      c.globalAlpha = 0.9;
      c.beginPath();
      c.moveTo(sx, sy);
      c.lineTo(ex, ey);
      c.stroke();
      c.beginPath();
      c.moveTo(ex + Math.cos(a) * 7, ey + Math.sin(a) * 7);
      c.lineTo(ex + Math.cos(a + 2.5) * 9, ey + Math.sin(a + 2.5) * 9);
      c.lineTo(ex + Math.cos(a - 2.5) * 9, ey + Math.sin(a - 2.5) * 9);
      c.closePath();
      c.fill();
      c.restore();
    }

    const bob = Math.sin(t * 3) * 2;
    drawBall(c, { x: x, y: y0 + bob, r: r, level: level, pop: 0 }, 0.88);

    if (state.charging) drawChargeHud(c, x, y0 + r + 8);
  }

  // 蓄力读数：质量、蓄力时间、实时初速（跟随待发射小球下方）

    c.fill();
    c.strokeStyle = 'rgba(234,223,207,.95)';
    c.lineWidth = 1.2;
    c.stroke();

    rr(c, x + 10, y + h - 7, w - 20, 4, 2);
    c.fillStyle = 'rgba(180,160,140,.22)';
    c.fill();
    if (ratio > 0.004) {
      rr(c, x + 10, y + h - 7, Math.max(4, (w - 20) * ratio), 4, 2);
      c.fillStyle = ratio >= 0.999 ? '#FF5C7A' : (ratio > 0.6 ? '#FF9F43' : '#2FB98C');
      c.fill();
    }

    c.font = '900 12.5px ' + FONT;

      x + w / 2, y + 10);
