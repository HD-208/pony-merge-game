  }

  function drawParticles(c) {
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      const a = 1 - p.life / p.max;
      c.save();
      c.globalAlpha = Math.max(0, a);
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.fillStyle = p.color;
      c.beginPath();
      c.arc(0, 0, p.r * (0.6 + a * 0.4), 0, TAU);
      c.fill();
      c.restore();
    }
  }

  function drawRings(c) {
    for (let i = 0; i < state.rings.length; i++) {
      const r = state.rings[i];
      const k = r.life / r.max;
      const rad = r.r0 + (r.r1 - r.r0) * k;
      c.save();
      c.globalAlpha = Math.max(0, 1 - k);
      c.strokeStyle = r.color;
      c.lineWidth = Math.max(1, 6 * (1 - k));
      c.beginPath();
      c.arc(r.x, r.y, rad, 0, TAU);
      c.stroke();
      c.restore();
    }
  }

  function drawPopups(c) {
    for (let i = 0; i < state.popups.length; i++) {
      const p = state.popups[i];
      const k = p.life / p.max;
      c.save();
      c.globalAlpha = Math.max(0, 1 - k * k);
      c.font = '900 ' + p.size + 'px ' + FONT;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.lineWidth = Math.max(3, p.size * 0.18);
      c.strokeStyle = 'rgba(255,255,255,.92)';
      c.strokeText(p.text, p.x, p.y);
      c.fillStyle = p.color;
      c.fillText(p.text, p.x, p.y);
      c.restore();
    }
  }

  function drawDangerLine(c, t) {
    const warn = state.danger > 0.15;
    const pulse = warn ? 0.55 + 0.35 * Math.sin(t * 12) : 0.32;
    c.save();
    c.setLineDash([9, 9]);
    c.lineDashOffset = -t * 26;
    c.lineWidth = warn ? 2.6 : 1.6;
    c.strokeStyle = 'rgba(255, 99, 99, ' + pulse + ')';
    c.beginPath();
    c.moveTo(PLAY.left + 4, LINE_Y);
    c.lineTo(PLAY.right - 4, LINE_Y);
    c.stroke();
    c.setLineDash([]);
    c.font = '700 10.5px ' + FONT;
    c.fillStyle = 'rgba(230, 100, 90, ' + (warn ? 0.85 : 0.45) + ')';
    c.textAlign = 'right';
    c.textBaseline = 'alphabetic';
    c.fillText('危险线', PLAY.right - 6, LINE_Y - 7);
    c.restore();

    if (state.danger > 0.3) {
      const a = Math.min(0.3, state.danger * 0.14) * (0.7 + 0.3 * Math.sin(t * 14));
      const vg = c.createRadialGradient(W / 2, state.worldH / 2, 120, W / 2, state.worldH / 2, 520);
      vg.addColorStop(0, 'rgba(255, 70, 70, 0)');
      vg.addColorStop(1, 'rgba(255, 70, 70, ' + a + ')');
      c.fillStyle = vg;
      c.fillRect(0, 0, W, state.worldH);
    }
  }

  // 瓶身长于可视区域时，右侧显示滚动条，提示可上下拖动查看底部
  function drawScrollBar(c) {
    if (state.worldH <= H + 1) return;
    const rect = canvas.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight || 0;
    if (!rect.height || rect.height <= vh + 2) return;
    const trackTop = 14;
    const trackH = state.worldH - 28;
    if (trackH <= 20) return;
    const visTop = clamp(-rect.top, 0, rect.height);
    const thumbH = Math.max(34, trackH * Math.min(1, vh / rect.height));
    const p = clamp(visTop / Math.max(1, rect.height - vh), 0, 1);
    const thumbY = trackTop + (trackH - thumbH) * p;
    c.save();
    rr(c, W - 16, trackTop, 6, trackH, 3);
    c.fillStyle = 'rgba(150,120,90,.14)';
    c.fill();
    rr(c, W - 16, thumbY, 6, thumbH, 3);
    c.fillStyle = 'rgba(255,92,122,.55)';
    c.fill();
    c.restore();
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackdrop(ctx, t);

    ctx.save();
    drawBoard(ctx);
    if (state.mode === 'playing') drawAim(ctx, t);
    for (let i = 0; i < state.balls.length; i++) drawBall(ctx, state.balls[i]);
    drawParticles(ctx);
    drawRings(ctx);
    drawPopups(ctx);
    drawDangerLine(ctx, t);
    if (state.mode === 'playing') drawScrollBar(ctx);
    ctx.restore();

    if (state.flash > 0) {
      ctx.fillStyle = 'rgba(255, 250, 235, ' + Math.min(0.7, state.flash * 0.5) + ')';
      ctx.fillRect(0, 0, W, state.worldH);
    }
  }

  /* ================= 物理 ================= */
  function makeBall(x, y, level, vx, vy) {
    const r = RADII[level - 1];
    const mass = ballMass(level);
    return {
      x: x, y: y,
      vx: vx || 0, vy: vy || 0,
      level: level, r: r, mass: mass, invMass: 1 / mass,
      life: 0, overT: 0, dead: false, pop: 0,
      sqX: 0, sqY: 0, sqVX: 0, sqVY: 0,
      prevX: x, prevY: y
    };
  }

  function kickSquash(b, amt, axis) {
    if (amt < 0.006) return;
    if (axis === 'y') {
      b.sqY = Math.min(b.sqY, -amt);
      b.sqX = Math.max(b.sqX, amt * 0.5);
      b.sqVY = 0;
    } else {
      b.sqX = Math.min(b.sqX, -amt);
      b.sqY = Math.max(b.sqY, amt * 0.5);
      b.sqVX = 0;
    }
  }

  function step(dt) {
    const balls = state.balls;

    // 积分 + 形变弹簧
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      b.life += dt;
      b.prevX = b.x;
      b.prevY = b.y;
      b.vy = Math.min(b.vy + GRAVITY * dt, 6200);
      b.vx *= AIR_DRAG;
      b.vy *= AIR_DRAG;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      b.sqVX += (-b.sqX * 300 - b.sqVX * 20) * dt;
      b.sqX += b.sqVX * dt;
      b.sqVY += (-b.sqY * 300 - b.sqVY * 20) * dt;
      b.sqY += b.sqVY * dt;
      b.sqX = clamp(b.sqX, -0.28, 0.28);
      b.sqY = clamp(b.sqY, -0.28, 0.28);

      // 瓶壁质量视为无穷大：法向速度等值反向（完全弹性）
      if (b.x - b.r < PLAY.left) {
        const impact = -b.vx;
        b.x = PLAY.left + b.r;
        if (impact > REST_THRESHOLD) {
          b.vx = impact * (impact > SOFT_IMPACT ? 1 : SOFT_REST);
          kickSquash(b, Math.min(0.18, impact / 2200), 'x');
          if (impact > 500) addParticles(PLAY.left + 2, b.y, 'rgba(226, 190, 150, .65)', 2);
        } else {
          b.vx = 0;
        }
      } else if (b.x + b.r > PLAY.right) {
        const impact = b.vx;
        b.x = PLAY.right - b.r;
        if (impact > REST_THRESHOLD) {
          b.vx = -impact * (impact > SOFT_IMPACT ? 1 : SOFT_REST);
          kickSquash(b, Math.min(0.18, impact / 2200), 'x');
          if (impact > 500) addParticles(PLAY.right - 2, b.y, 'rgba(226, 190, 150, .65)', 2);
        } else {
          b.vx = 0;
        }
      }

      if (b.y + b.r > floorY()) {
        const impact = b.vy;
        b.y = floorY() - b.r;
        if (impact > REST_THRESHOLD) {
          b.vy = -impact * (impact > SOFT_IMPACT ? 1 : SOFT_REST);
          kickSquash(b, Math.min(0.26, impact / 1700), 'y');
          if (impact > 650) {
            addParticles(b.x, floorY() - 3, 'rgba(196, 164, 126, .75)', 3);
          }
        } else {
          b.vy = 0;
        }
        b.vx *= FLOOR_FRICTION;
      }

      if (b.y - b.r < 2) {
        const impact = -b.vy;
        b.y = 2 + b.r;
        if (impact > REST_THRESHOLD) {
          b.vy = impact * (impact > SOFT_IMPACT ? 1 : SOFT_REST);
          kickSquash(b, Math.min(0.12, impact / 2600), 'y');
          if (impact > 500) addParticles(b.x, 4, 'rgba(226, 190, 150, .65)', 2);
        } else if (b.vy < 0) {
          b.vy = 0;
        }
      }
    }

    const events = [];
    const ITER = 4;

    for (let iter = 0; iter < ITER; iter++) {
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (a.dead) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (b.dead) continue;

          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let d2 = dx * dx + dy * dy;
          const minD = a.r + b.r;
          if (d2 >= minD * minD) continue;

          let d = Math.sqrt(d2);
          if (d < 0.001) { d = 0.001; dx = 0.001; dy = 0; }

          // 终极伙伴不再互相吞噬，只做普通弹性碰撞
          if (a.level === b.level && a.level < LEVELS.length) {
            a.dead = true;
            b.dead = true;
            events.push({
              x: (a.x + b.x) / 2,
              y: (a.y + b.y) / 2,
              level: a.level,
              vx: (a.vx + b.vx) / 2,
              vy: (a.vy + b.vy) / 2
            });
            continue;
          }

          const invA = a.invMass;
          const invB = b.invMass;
          const invSum = invA + invB;
          if (invSum <= 0) continue;

          const nx = dx / d;
          const ny = dy / d;
          const overlap = minD - d;

          // 位置修正：留一点 slop，减少堆积抖动
          const corr = Math.max(0, overlap - 0.3) * 0.7 / invSum;
          a.x -= nx * corr * invA;
          a.y -= ny * corr * invA;
          b.x += nx * corr * invB;
          b.y += ny * corr * invB;

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            // 完全弹性碰撞：动量守恒 + 动能守恒，质量大的球速度变化小
            const speed = -vn;
            const e = speed > REST_THRESHOLD ? 1 : 0;
            const jn = -(1 + e) * vn / invSum;
            a.vx -= jn * nx * invA;
            a.vy -= jn * ny * invA;
            b.vx += jn * nx * invB;
            b.vy += jn * ny * invB;

            if (speed > 120) {
              const amt = Math.min(0.15, speed / 3000);
              if (Math.abs(ny) > Math.abs(nx)) {
                const vAmt = amt * Math.abs(ny);
                kickSquash(a, vAmt, 'y');
                kickSquash(b, vAmt, 'y');
              } else {
                const hAmt = amt * Math.abs(nx);
                kickSquash(a, hAmt, 'x');
                kickSquash(b, hAmt, 'x');
              }
            }
          }
        }
      }

      // 位置修正后再次夹墙
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (b.dead) continue;
        if (b.x - b.r < PLAY.left) {
          b.x = PLAY.left + b.r;
          if (b.vx < 0) b.vx = 0;
        } else if (b.x + b.r > PLAY.right) {
          b.x = PLAY.right - b.r;
          if (b.vx > 0) b.vx = 0;
        }
        if (b.y + b.r > floorY()) {
          b.y = floorY() - b.r;
          if (b.vy > 0) b.vy = 0;
        }
        if (b.y - b.r < 2) {
          b.y = 2 + b.r;
          if (b.vy < 0) b.vy = 0;
        }
      }
    }

    if (events.length) {
      state.balls = balls.filter(function (b) { return !b.dead; });
      for (let i = 0; i < events.length; i++) merge(events[i]);
    }
  }

  function merge(ev) {
    const nextLevel = ev.level + 1;
    state.combo = Math.min(9, state.combo + 1);
    state.comboT = 1.2;

    const def = LEVELS[nextLevel - 1];
    const nb = makeBall(ev.x, ev.y, nextLevel, ev.vx * 0.4, ev.vy * 0.35 - 160);
    nb.x = clamp(nb.x, PLAY.left + nb.r, PLAY.right - nb.r);
    nb.y = Math.min(nb.y, floorY() - nb.r);
    nb.pop = 1;
    state.balls.push(nb);
    if (nextLevel === LEVELS.length) {
      state.finalCount += 1;
      const grow = nb.r * 0.5;
      state.worldH += grow;
      syncCanvasSize();
      addPopup(nb.x, nb.y - nb.r - 18, '瓶身 +' + Math.round(grow), '#2FBF71', 22);
    }

    state.maxLevel = Math.max(state.maxLevel, nextLevel);
    const gain = nextLevel * 6 + (state.combo > 1 ? state.combo * 3 : 0);
    state.score += gain;

    addPopup(ev.x, ev.y - nb.r - 4, '+' + gain, mix(def.color, '#000000', 0.15), 20 + nextLevel * 1.4);
    if (state.combo >= 2) addPopup(ev.x, ev.y - nb.r - 30, '连击 x' + state.combo, '#FF7A59', 17);
    burst(ev.x, ev.y, def.color, Math.round(8 + nextLevel * 1.6));
    ring(ev.x, ev.y, nb.r * 0.6, nb.r * 2.2, def.color, 0.38);

    state.flash = Math.max(state.flash, nextLevel === LEVELS.length ? 0.55 : 0);
    const charKey = def.key;
    const firstVoice = !state.voicePlayed[charKey];
    if (firstVoice) state.voicePlayed[charKey] = true;
    updateScoreUI(true);
    if (!firstVoice) playMerge(nextLevel);
    if (nextLevel === LEVELS.length) {
      burst(ev.x, ev.y, '#FFE066', 30);
      ring(ev.x, ev.y, 30, 300, '#FFE066', 0.9);
      if (firstVoice) {
        playCharVoice(charKey, null);
      } else {
        playKing();
      }
      state.pendingQuiz = true;
    } else if (firstVoice) {
      const token = state.voiceToken;
      playCharVoice(charKey, function () {
        if (state.voiceToken === token && state.mode === 'playing') queueLearningWord();
      });
    } else {
      queueLearningWord();
    }
  }

  function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const sp = rand(60, 340);
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 80,
        r: rand(2, 6),
        color: color,
        life: 0,
        max: rand(0.4, 0.9),
        rot: rand(0, TAU),
        vr: rand(-6, 6)
      });
    }
  }
  const burst = addParticles;

  function ring(x, y, r0, r1, color, life) {
    state.rings.push({ x: x, y: y, r0: r0, r1: r1, color: color, life: 0, max: life });
  }

  function addPopup(x, y, text, color, size) {
    state.popups.push({ x: x, y: y, text: text, color: color, size: size, life: 0, max: 1.1 });
  }

  /* ================= 游戏流程 ================= */
  function randLevel() {
    return pick(SPAWN_POOL);
  }

  function updateScoreUI(bump) {
    scoreEl.textContent = state.score;
    bestEl.textContent = Math.max(state.best, state.score);
    if (bump) {
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
    }
  }

  function renderNext() {
    nctx.setTransform(NDPR, 0, 0, NDPR, 0, 0);
    nctx.clearRect(0, 0, NW, NW);
    const lv = state.next;
    const def = LEVELS[lv - 1];
    const r = clamp(RADII[lv - 1] * 0.78, 13, 28);
    drawBall(nctx, { x: NW / 2, y: NW / 2 - 2, r: r, level: lv, pop: 0 }, 1);
    nextNameEl.textContent = def.name;
    nextNameEl.style.color = mix(def.color, '#000000', 0.45);
  }

  function reset() {
    state.session++;
    if (state.score > state.best) {
      state.best = state.score;
      store('dhw_best', String(state.best));
    }
    state.mode = 'playing';
    state.time = 0;
    state.acc = 0;
    state.alpha = 0;
    state.balls = [];
    state.particles = [];
    state.popups = [];
    state.rings = [];
    state.score = 0;
    state.maxLevel = 1;
    state.worldH = H;
    syncCanvasSize();
    state.finalCount = 0;
    state.scrolling = false;
    state.charging = false;
    state.charge = 0;
    state.current = randLevel();
    state.next = randLevel();
    state.aimX = W / 2;
    state.aiming = false;
    state.aimPointerX = 0;
    state.aimPointerY = 0;
    state.aimDx = 0;
    state.aimDy = 0;
    state.aimPower = 0;
    state.lastDrop = -10;
    state.pointerDown = false;
    state.danger = 0;
    state.flash = 0;
    state.combo = 0;
    state.comboT = 0;
    state.pendingMergeSound = 0;
    state.lastMergeSoundAt = -1;
    state.pendingQuiz = false;
    state.quizQueue = [];
    state.quizCurrent = null;
    state.quizAnswered = false;
    state.lastQuizWord = '';
    state.lastPickedEn = '';
    state.quizWord = null;
    state.voicePlayed = {};
    state.voiceToken += 1;
    state.scoreRecorded = false;
    state.lastScoreTs = 0;
    stopCharVoices();
    resetWordQueue();
    queueLearningWord();
    updateScoreUI(false);
    renderNext();
    overlayEl.classList.add('hide');
  }

  function getLaunchVelocity() {
    // 初速只由蓄力时间决定：按得越久，数字越大、飞得越快
    const speed = chargeSpeed(state.charge);
    const dx = state.aimDx;
    const dy = state.aimDy;
    const len = Math.hypot(dx, dy);
    if (len < 12 || dy <= 6) {
      return { vx: 0, vy: speed, power: speed / MAX_LAUNCH, speed: speed, angle: Math.PI / 2 };
    }
    let nx = dx / len;
    let ny = dy / len;
    if (ny < 0.4) {
      ny = 0.4;
      nx = (dx < 0 ? -1 : 1) * Math.sqrt(1 - ny * ny);
    }
    return {
      vx: nx * speed,
      vy: ny * speed,
      power: speed / MAX_LAUNCH,
      speed: speed,
      angle: Math.atan2(ny, nx)
    };
  }

  function launch() {
    if (state.mode !== 'playing') return;
    if (state.time - state.lastDrop < 0.3) return;
    const level = state.current;
    const r = RADII[level - 1];
    const x = clamp(state.aimX, PLAY.left + r, PLAY.right - r);
    const v = getLaunchVelocity();
    const b = makeBall(x, Math.max(DROP_Y, r + 2), level, v.vx, v.vy);
    state.balls.push(b);
    state.lastDrop = state.time;
    state.current = state.next;
    state.next = randLevel();
    renderNext();
    playLaunch(v.power);
    state.charging = false;
    state.charge = 0;
    if (v.power > 0.05) {
      const def = LEVELS[level - 1];
      ring(x, DROP_Y, r * 0.7, r * 2.2, def.color, 0.32);
      addParticles(x, DROP_Y, mix(def.color, '#FFFFFF', 0.35), 5);
    }
    if (v.speed > 2200) {
      addPopup(x, Math.max(DROP_Y, r + 2) + 34, '初速 ' + Math.round(v.speed), '#FF7A59', 18);
    }
  }

  function gameOver() {
    if (state.mode !== 'playing') return;
    state.mode = 'over';
    state.flash = 0.45;
    state.pendingMergeSound = 0;
    state.pendingQuiz = false;
    state.quizCurrent = null;
    state.quizAnswered = false;
    resetWordQueue();
    playOver();

    let isRecord = false;
    if (state.score > state.best) {
      state.best = state.score;
      store('dhw_best', String(state.best));
      isRecord = true;
    }
    bestEl.textContent = state.best;

    const session = state.session;
    const biggest = LEVELS[state.maxLevel - 1];
    let rankInfo = null;
    if (!state.scoreRecorded) {
      rankInfo = recordScore(state.score, biggest);
      state.lastScoreTs = rankInfo.rec.ts;
    }
    setTimeout(function () {
      if (state.session !== session || state.mode !== 'over') return;
      showGameOverPanel(isRecord, biggest, rankInfo);
    }, 700);
  }

  function showStartScreen() {
    state.mode = 'ready';
    state.worldH = H;
    syncCanvasSize();
    state.finalCount = 0;
    state.scrolling = false;
    state.charging = false;
    state.charge = 0;
    overlayEl.classList.remove('editor-open');
    resetWordQueue();
    const finalName = LEVELS[LEVELS.length - 1].name;
    let gradeButtons = '';
    for (let g = 1; g <= 9; g++) {
      const total = (WORD_BANKS[g] || []).length;
      gradeButtons += '<button type="button" class="grade-btn' + (state.grade === g ? ' active' : '') +
        '" data-grade="' + g + '"><span class="gn">' + GRADE_LABELS[g] + '</span>' +
        '<span class="gm">' + total + ' 词 · 已学 ' + learnedCount(g) + '</span></button>';
    }
    overlayEl.innerHTML =
      '<div class="panel">' +
        '<p class="eyebrow">MY LITTLE PONY · 英语合成</p>' +
        '<h2>合成<em>小马</em></h2>' +
        '<p class="desc">' + LEVELS.length + ' 位伙伴同场，同款相撞就会合成下一位<br>每次合成都学一个英语单词，合出' + finalName + '还有单词挑战</p>' +
        '<div class="grade-picker">' +
          '<p class="grade-title">第一步：选择年级（小学 + 初中）</p>' +
          '<div class="grade-grid">' + gradeButtons + '</div>' +
        '</div>' +
        '<div class="level-summary">' +
          '<span><b>' + LEVELS.length + '</b> 级合成 · 终极伙伴 <b>' + finalName + '</b><br>层级和顺序都可以自己定</span>' +
          '<button class="btn ghost mini" id="levelSettingsBtn" type="button">调整关卡</button>' +
        '</div>' +
        '<div class="nick-row"><input id="nickInput" type="text" maxlength="10" placeholder="昵称（用于本机排行榜）" value="' + esc(state.playerName) + '"></div>' +
        '<button class="btn primary" id="startBtn" type="button"' + (state.grade ? '' : ' disabled') + '>开 始 合 成</button>' +
        '<p class="tiny">拖拽发射 · 撞墙反弹 · 自动朗读单词 · 手机可点「听」重听</p>' +
      '</div>';
    overlayEl.classList.remove('hide');

    overlayEl.querySelectorAll('.grade-btn').forEach(function (gradeBtn) {
      gradeBtn.addEventListener('click', function () {
        state.grade = Number(gradeBtn.dataset.grade);
        store('dhw_grade', String(state.grade));
        overlayEl.querySelectorAll('.grade-btn').forEach(function (b) {
          b.classList.toggle('active', b === gradeBtn);
        });
        document.getElementById('startBtn').disabled = false;
        ensureAudio();
        resetWordQueue();
      });
    });

    const nickInput = document.getElementById('nickInput');
    if (nickInput) {
      nickInput.addEventListener('input', function () {
        state.playerName = nickInput.value.trim().slice(0, 10);
        store('dhw_nick', state.playerName);
      });
    }

    const settingsBtn = document.getElementById('levelSettingsBtn');
    if (settingsBtn) settingsBtn.addEventListener('click', openLevelEditor);

    const btn = document.getElementById('startBtn');
    btn.addEventListener('click', function () {
      if (!state.grade) return;
      if (nickInput) {
        state.playerName = nickInput.value.trim().slice(0, 10);
        store('dhw_nick', state.playerName);
      }
      ensureAudio();
      reset();
      playStartChime();
    });
  }

  /* ================= 本机排行榜 ================= */
  const SCORE_KEY = 'dhw_scores_v1';

  function loadScores() {
    let list = [];
    try { list = JSON.parse(load(SCORE_KEY) || '[]'); } catch (e) { list = []; }
    if (!Array.isArray(list)) return [];
    return list.filter(function (r) {
      return r && typeof r.score === 'number' && isFinite(r.score);
    });
  }

  function sortScores(list) {
    return list.slice().sort(function (a, b) {
      return b.score - a.score || (a.ts || 0) - (b.ts || 0);
    });
  }

  function recordScore(score, biggest) {
    state.scoreRecorded = true;
    const name = (state.playerName || '').trim().slice(0, 10) || '小马同学';
    const rec = {
      name: name,
      score: Math.max(0, Math.round(score)),
      level: biggest ? biggest.name : '',
      levels: LEVELS.length,
      grade: state.grade,
      final: state.finalCount || 0,
      ts: Date.now()
    };
    const sorted = sortScores(loadScores().concat([rec]));
    saveScores(sorted.slice(0, 30));
    return { rec: rec, rank: sorted.indexOf(rec) + 1, total: sorted.length };
  }

  function saveScores(list) {
    store(SCORE_KEY, JSON.stringify(list));
  }

  function copyText(text) {
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-999px';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(function () {});
      ok = true;
    }
    return ok;
  }

  function shareScore() {
    const best = Math.max(state.score, Number(state.best) || 0);
    const finalName = LEVELS[LEVELS.length - 1].name;
    const text = '我在《合成小马》里用 ' + LEVELS.length + ' 级关卡拿了 ' + best +
      ' 分，目标是合出' + finalName + '！你也来试试：' + location.href;
    const fallback = function () {
      if (!copyText(text)) return;
      const btn = document.getElementById('shareScoreBtn') || document.getElementById('shareFromOverBtn');
      if (btn) {
        const old = btn.textContent;
        btn.textContent = '已复制，去微信粘贴吧';
        setTimeout(function () { btn.textContent = old; }, 1800);
      }
    };
    if (navigator.share) {
      navigator.share({ title: '合成小马 · 英语单词合成', text: text, url: location.href }).catch(fallback);
      return;
    }
    fallback();
  }

  function showRankPanel(canResume) {
    const wasPlaying = state.mode === 'playing';
    if (wasPlaying) state.mode = 'ready';
    const list = sortScores(loadScores()).slice(0, 20);
    let rows = '';
    if (!list.length) {
      rows = '<p class="rank-empty">还没有成绩，先玩一局吧</p>';
    } else {
      list.forEach(function (r, i) {
        rows += '<div class="rank-row' + (r.ts === state.lastScoreTs ? ' me' : '') + '">' +
          '<span class="rank-no' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</span>' +
          '<span class="rank-name">' + esc(r.name || '小马同学') + '</span>' +
          '<span class="rank-meta">' + esc(r.level || '—') + (typeof r.final === 'number' ? ' · 终极 ' + r.final : '') + '<br>' + (r.levels || 9) + ' 级</span>' +
          '<span class="rank-score">' + r.score + '</span>' +
        '</div>';
      });
    }
    overlayEl.innerHTML =
      '<div class="panel rank-panel">' +
        '<p class="eyebrow">LEADERBOARD</p>' +
        '<h2>本机<em>排行榜</em></h2>' +
        '<p class="desc" style="margin-bottom:10px">只统计这台设备上的成绩<br>昵称可以在开始页修改</p>' +
        '<p class="rank-note">微信好友榜需要微信登录授权、AppID、备案域名和服务器后端，纯网页游戏读不到微信好友关系。这里先把成绩记在本机，点「分享成绩」发到微信，就能和好友比拼。</p>' +
        '<div class="rank-list">' + rows + '</div>' +
        '<button class="btn primary" id="shareScoreBtn" type="button" style="width:100%">分 享 成 绩</button>' +
        '<button class="btn ghost" id="rankBackBtn" type="button" style="margin-top:10px;width:100%">' +
          (canResume && wasPlaying ? '继 续 游 戏' : '返 回') + '</button>' +
      '</div>';
    overlayEl.classList.remove('hide');
    document.getElementById('shareScoreBtn').addEventListener('click', shareScore);
    document.getElementById('rankBackBtn').addEventListener('click', function () {
      if (canResume && wasPlaying) {
        state.mode = 'playing';
        overlayEl.classList.add('hide');
      } else {
        showStartScreen();
      }
    });
  }

  /* ================= 关卡自定义 ================= */
  function openLevelEditor() {
    const conf = loadLevelSettings();
    let count = conf.count;
    let order = conf.order.slice();

    function render() {
      let presets = '';
      LEVEL_PRESETS.forEach(function (n) {
        presets += '<button type="button" class="preset-btn' + (n === count ? ' active' : '') +
          '" data-count="' + n + '">' + n + ' 级</button>';
      });
      let rows = '';
      for (let i = 0; i < order.length; i++) {
        let opts = '';
        CHARACTERS.forEach(function (c) {
          opts += '<option value="' + c.key + '"' + (c.key === order[i] ? ' selected' : '') + '>' +
            c.name + '（' + c.en + '）</option>';
        });
        rows += '<div class="order-row"><span class="order-lv">LV.' + (i + 1) + '</span>' +
          '<img src="' + (CHAR_THUMBS[order[i]] || '') + '" alt="">' +
          '<select data-index="' + i + '">' + opts + '</select></div>';
      }
      overlayEl.innerHTML =
        '<div class="panel editor-panel">' +
          '<p class="eyebrow">CUSTOM LEVELS</p>' +
          '<h2>关卡<em>自定义</em></h2>' +
          '<p class="desc">先选合成等级数量，再决定每一级是谁<br>选到重复角色会自动交换两级位置</p>' +
          '<div class="preset-row">' + presets + '</div>' +
          '<div class="order-list">' + rows + '</div>' +
          '<p class="tiny" style="margin:0 0 12px;text-align:center">最多 ' + MAX_LEVELS + ' 级 · 当前 ' + count + ' 级</p>' +
          '<div class="editor-actions">' +
            '<button class="btn primary" id="editorSaveBtn" type="button">保 存 并 返 回</button>' +
            '<div class="editor-actions-row">' +
              '<button class="btn ghost" id="editorResetBtn" type="button">恢复默认</button>' +
              '<button class="btn ghost" id="editorCancelBtn" type="button">取 消</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      overlayEl.classList.add('editor-open');
      overlayEl.classList.remove('hide');
      overlayEl.querySelectorAll('.preset-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          const nextCount = Number(b.dataset.count);
          order = resizeOrder(order, nextCount);
          count = nextCount;
          render();
        });
      });
      overlayEl.querySelectorAll('.order-row select').forEach(function (sel) {
        sel.addEventListener('change', function () {
          const i = Number(sel.dataset.index);
          const key = sel.value;
          const dup = order.indexOf(key);
          if (dup >= 0 && dup !== i) order[dup] = order[i];
          order[i] = key;
          render();
        });
      });
      document.getElementById('editorSaveBtn').addEventListener('click', function () {
        saveLevelSettings(count, order);
        applyLevelSettings();
        buildLegend();
        state.balls = [];
        state.particles = [];
        state.popups = [];
        state.rings = [];
        state.score = 0;
        state.maxLevel = 1;
        updateScoreUI(false);
        state.current = randLevel();
        state.next = randLevel();
        renderNext();
        showStartScreen();
      });
      document.getElementById('editorResetBtn').addEventListener('click', function () {
        order = defaultOrder(count);
        render();
      });
      document.getElementById('editorCancelBtn').addEventListener('click', showStartScreen);
    }

    render();
  }

  function showGameOverPanel(isRecord, biggest, rankInfo) {
    const biggestColor = mix(biggest.color, '#000000', 0.2);
    overlayEl.innerHTML =
      '<div class="panel">' +
        '<p class="eyebrow">GAME OVER</p>' +
        '<h2>小马满盆了</h2>' +
        '<p class="desc" style="margin-bottom:4px">本局得分</p>' +
        '<div class="final">' + state.score + '</div>' +
        (isRecord
          ? '<p class="record">新纪录</p>'
          : '<p class="desc" style="margin:0 0 10px">历史最高 ' + state.best + '</p>') +
        '<p class="desc" style="margin:8px 0 6px">最高合出：<b style="color:' + biggestColor + '">' + biggest.name + '</b></p>' +
        '<p class="desc" style="margin:0 0 6px">本局合成终极伙伴 ' + state.finalCount + ' 个</p>' +
        (rankInfo
          ? '<p class="desc" style="margin:0 0 16px">本机排名 <b>第 ' + rankInfo.rank + ' 名</b> · 共 ' + rankInfo.total + ' 条成绩</p>'
          : '<p class="desc" style="margin:0 0 16px">成绩已记录</p>') +
        '<button class="btn primary" id="againBtn" type="button">再 来 一 局</button>' +
        '<div style="display:flex;gap:8px;margin-top:10px">' +
          '<button class="btn ghost" id="changeGradeBtn" type="button" style="flex:1">换个年级</button>' +
          '<button class="btn ghost" id="rankFromOverBtn" type="button" style="flex:1">排行榜</button>' +
        '</div>' +
        '<button class="btn ghost" id="shareFromOverBtn" type="button" style="margin-top:10px;width:100%">分 享 成 绩</button>' +
        '<p class="tiny">点图鉴可以听伙伴的英文名字</p>' +
      '</div>';
    overlayEl.classList.remove('hide');
    const btn = document.getElementById('againBtn');
    btn.addEventListener('click', function () {
      ensureAudio();
      reset();
    });
    const changeBtn = document.getElementById('changeGradeBtn');
    if (changeBtn) {
      changeBtn.addEventListener('click', function () {
        showStartScreen();
      });
    }
    const rankBtn = document.getElementById('rankFromOverBtn');
    if (rankBtn) {
      rankBtn.addEventListener('click', function () {
        showRankPanel(false);
      });
    }
    const shareBtn = document.getElementById('shareFromOverBtn');
    if (shareBtn) shareBtn.addEventListener('click', shareScore);
  }

  /* ================= 输入 ================= */
  function worldFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return { x: W / 2, y: H / 2 };
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (state.worldH / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (state.mode !== 'playing') return;
    if (e.cancelable) e.preventDefault();
    ensureAudio();
    const p = worldFromEvent(e);
    // 瓶身高于可视区时，最右侧一条用于上下拖动查看底部（避开瞄准发射区）
    const rect = canvas.getBoundingClientRect();
    if (p.x > W - 36 && rect.height > (window.innerHeight || 0) + 2) {
      state.scrolling = true;
      state.scrollLastY = e.clientY;
      state.aiming = false;
      state.pointerDown = false;
      return;
    }
    const r = RADII[state.current - 1];
    state.aimX = clamp(p.x, PLAY.left + r, PLAY.right - r);
    state.pointerDown = true;
    state.aiming = true;
    // 按住即开始蓄力：时间越久，发射初速越大
    state.charging = true;
    state.charge = 0;
    state.aimPointerX = p.x;
    state.aimPointerY = p.y;
    state.aimDx = 0;
    state.aimDy = 0;
    state.aimPower = 0;
  });

  canvas.addEventListener('pointermove', function (e) {
    if (state.mode !== 'playing') return;
    if (state.scrolling) {
      const dy = state.scrollLastY - e.clientY;
      if (dy) window.scrollBy(0, dy);
      state.scrollLastY = e.clientY;
      return;
    }
    const p = worldFromEvent(e);
    if (state.aiming) {
      state.aimDx = p.x - state.aimPointerX;
      state.aimDy = p.y - state.aimPointerY;
      state.aimPower = clamp(Math.hypot(state.aimDx, state.aimDy) / 170, 0, 1);
    } else {
      const r = RADII[state.current - 1];
      state.aimX = clamp(p.x, PLAY.left + r, PLAY.right - r);
    }
  });

  canvas.addEventListener('pointercancel', function () {
    state.pointerDown = false;
    state.scrolling = false;
    state.charging = false;
    state.aiming = false;
    state.aimDx = 0;
    state.aimDy = 0;
    state.aimPower = 0;
  });

  window.addEventListener('pointerup', function () {
    if (state.scrolling) {
      state.scrolling = false;
      return;
    }
    if (!state.pointerDown) return;
    state.pointerDown = false;
    if (state.mode === 'playing') launch();
    state.charging = false;
    state.aiming = false;
    state.aimDx = 0;
    state.aimDy = 0;
    state.aimPower = 0;
  });

  window.addEventListener('keydown', function (e) {
    if (state.mode !== 'playing') return;
    if (e.key === 'ArrowLeft') {
      state.aimX = clamp(state.aimX - 18, PLAY.left, PLAY.right);
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      state.aimX = clamp(state.aimX + 18, PLAY.left, PLAY.right);
      e.preventDefault();
    } else if (e.key === ' ' || e.key === 'Enter') {
      ensureAudio();
      state.aimDx = 0;
      state.aimDy = 0;
      state.aimPower = 0;
      launch();
      e.preventDefault();
    }
  });

  soundBtn.addEventListener('click', function () {
    const nextMuted = !muted;
    setMuted(nextMuted);
    if (!nextMuted) {
      ensureAudio();
      playStartChime();
      if (state.currentWord && state.mode === 'playing') {
        state.wordBusy = true;
        speakEnglish(state.currentWord.en, function () {
          state.wordBusy = false;
          setTimeout(pumpWords, 160);
        });
      }
    }
  });

  wordListen.addEventListener('click', function () {
    ensureAudio();
    const w = state.currentWord;
    if (!w) return;
    if (muted) setMuted(false);
    state.wordBusy = true;
    speakEnglish(w.en, function () {
      state.wordBusy = false;
      setTimeout(pumpWords, 160);
    });
  });

  document.getElementById('rankBtn').addEventListener('click', function () {
    if (state.mode === 'quiz') return;
    ensureAudio();
    showRankPanel(true);
  });

  restartBtn.addEventListener('click', function () {
    if (!state.grade || state.mode === 'ready') {
      showStartScreen();
      return;
    }
    ensureAudio();
    reset();
    playStartChime();
  });

  /* ================= 帧循环 ================= */
  function updateParticles(dt) {
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      p.life += dt;
      p.vy += 900 * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    state.particles = state.particles.filter(function (p) { return p.life < p.max; });

    for (let i = 0; i < state.rings.length; i++) state.rings[i].life += dt;
    state.rings = state.rings.filter(function (r) { return r.life < r.max; });

    for (let i = 0; i < state.popups.length; i++) {
      const p = state.popups[i];
      p.life += dt;
      p.y -= 36 * dt;
    }
    state.popups = state.popups.filter(function (p) { return p.life < p.max; });
  }

  function update(dt) {
    state.time += dt;
    state.flash = Math.max(0, state.flash - dt * 2.2);

    if (state.mode === 'playing') {
      // 固定物理步长，保证不同帧率下手感一致
      state.acc += dt;
      const FIXED = 1 / 180;
      let steps = 0;
      while (state.acc >= FIXED && steps < 12) {
        // 高速球细分物理步长，避免完全弹性反弹时穿过别的球
        let mx = 0;
        for (let i = 0; i < state.balls.length; i++) {
          const b = state.balls[i];
          const sp = Math.abs(b.vx) + Math.abs(b.vy);
          if (sp > mx) mx = sp;
        }
        const sub = mx > 1600 ? Math.min(4, Math.ceil(mx / 1600)) : 1;
        for (let k = 0; k < sub; k++) step(FIXED / sub);
        state.acc -= FIXED;
        steps++;
      }
      if (steps >= 12) state.acc = 0;
      state.alpha = clamp(state.acc / FIXED, 0, 1);

      // 合并音效节流：同一小段时间内只播放等级最高的那一个
      if (state.pendingMergeSound && state.time - state.lastMergeSoundAt >= 0.07) {
        const lv = state.pendingMergeSound;
        state.pendingMergeSound = 0;
        state.lastMergeSoundAt = state.time;
        playMerge(lv);
      }

      // 合出最高级伙伴：先放庆祝音效，再暂停游戏出奖励题
      if (state.pendingQuiz) {
        state.pendingQuiz = false;
        if (state.pendingMergeSound) {
          const lv = state.pendingMergeSound;
          state.pendingMergeSound = 0;
          state.lastMergeSoundAt = state.time;
          playMerge(lv);
        }
        openQuiz();
        return;
      }

      // 蓄力：按住待发射的小球，时间越久初速越大
      if (state.charging) state.charge += dt;

      // 危险线：必须连续滞留上方，避免完全弹性弹跳造成误判
      let danger = 0;
      for (let i = 0; i < state.balls.length; i++) {
        const b = state.balls[i];
        if (b.life > 1.1 && b.y - b.r < LINE_Y - 2) {
          b.overT += dt;
          danger = Math.max(danger, b.overT / 1.5);
        } else {
          b.overT = 0;
        }
      }
      state.danger = Math.min(1, danger);
      if (state.danger >= 1) gameOver();

      if (state.comboT > 0) {
        state.comboT -= dt;
        if (state.comboT <= 0) state.combo = 0;
      }
      for (let i = 0; i < state.balls.length; i++) {
        const b = state.balls[i];
        b.pop = Math.max(0, b.pop - dt * 5);
      }
    }

    updateParticles(dt);
  }

  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - lastT) / 1000));
    lastT = now;
    update(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  /* ================= 启动 ================= */
  soundBtn.textContent = muted ? '声音：关' : '声音：开';
  soundBtn.classList.toggle('muted', muted);
  applyLevelSettings();
  buildLegend();
  bestEl.textContent = state.best;
  state.current = randLevel();
  state.next = randLevel();
  renderNext();
  showStartScreen();
  requestAnimationFrame(frame);
})();
</script>
</body>
